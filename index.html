<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLANET OPS</title>
<style>
:root{color-scheme:dark;--bg:#02030a;--panel:#0d1630;--blue:#0b3d91;--red:#fc3d21;--fg:#eaf0ff;--mut:#8fa3d1;--ok:#3ddc97;--warn:#ffb020}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;pointer-events:none}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.3em;font-size:13px;margin-bottom:6px;color:#19e6e6;text-shadow:0 0 8px #19e6e6aa}
.ball{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a63c9,var(--blue));border:2px solid #fff;position:relative;overflow:hidden}
.ball:after{content:"";position:absolute;left:-10%;right:-10%;top:55%;height:3px;background:var(--red);transform:rotate(-25deg)}
#hud{display:flex;flex-direction:column;gap:4px;width:112px;margin-left:auto}#hud[hidden]{display:none}
.g{background:#0d1630cc;border:1px solid #1f2f5c;border-radius:10px;padding:3px 6px;font-size:10px;color:var(--mut)}
.g b{display:block;color:var(--fg);font-size:10px;margin-bottom:2px}
.bar{height:5px;background:#0a1124;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .8s,background .4s}
#hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 100px);left:0;right:0;text-align:center;font-size:14px;text-shadow:0 1px 6px #000;pointer-events:none;padding:0 128px 0 14px}
#ui{position:fixed;left:0;right:0;bottom:0;max-height:62vh;overflow:auto;background:linear-gradient(180deg,#0d1630ee,#060b1cf5);border-top:1px solid #1f2f5c;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
#ui:empty{display:none}
#joy{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:230px;height:230px;border-radius:50%;background:#ffffff24;border:3px solid #ffffffaa;box-shadow:inset 0 0 0 16px #ffffff10,0 0 22px #19e6e655;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:100px;height:100px;margin:-50px;border-radius:50%;background:#19e6e6cc;border:3px solid #fff;box-shadow:0 0 16px #19e6e6}
h1,h2{margin:0 0 8px}h1{font-size:24px}h2{font-size:19px}
p{line-height:1.55;margin:0 0 10px}.mut{color:var(--mut)}
.row{display:grid;gap:9px;margin-top:12px}
button{font:inherit;color:var(--fg);background:var(--blue);border:1px solid #3a67c4;border-radius:12px;padding:12px 14px;cursor:pointer;text-align:start}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{opacity:.45}
button small{display:block;color:#b9c8ee;margin-top:4px;font-size:12px}
.go{background:var(--red);border-color:#ff7a63;text-align:center;font-weight:700}
.big{font-size:48px;text-align:center;line-height:1.1;margin:4px 0}
.load{height:8px;background:#0a1124;border-radius:5px;overflow:hidden;margin:6px 0}
.load i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--red));transition:width 1.2s ease}
.panel{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}
.panel button{text-align:center;font-weight:700;padding:16px 6px}
.panel button.on{background:var(--ok);color:#04210f;border-color:#9ff0c9}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sig{color:var(--red);font-weight:800;text-align:center;animation:bl 1s steps(2) infinite;margin:8px 0}
@keyframes bl{50%{opacity:.25}}
.warnbox{border:1px solid var(--red);background:#fc3d2118;border-radius:12px;padding:10px;margin-bottom:10px}
.result{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.result div{background:#0a1124;border-radius:10px;padding:9px;font-size:12px;color:var(--mut)}
.result b{display:block;color:var(--fg);font-size:16px}
.tag{display:inline-block;background:#1f2f5c;border-radius:20px;padding:3px 10px;font-size:12px;margin:2px 0 2px 4px}
.fine{font-size:10px;color:var(--mut);text-align:center;margin-top:10px}
.cb{position:relative;height:26px;border:2px solid #19e6e6;background:#042a2e}
.cb i{display:block;height:100%;width:0;background:#19e6e6;transition:width 1.2s ease}
.cb span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:.3em;color:#0a6a6a;mix-blend-mode:difference}
#bt{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);padding:0 8%;text-align:center}
.play{font-size:56px;font-weight:900;letter-spacing:.08em;color:#4dff6a;background:none;border:none;text-align:center;text-shadow:3px 0 #ff2bd6,-3px 0 #19e6e6;animation:gl 1.2s infinite;-webkit-text-stroke:2px #052b10;padding:8px 20px}
@keyframes gl{0%,88%,100%{transform:translate(0)}90%{transform:translate(-4px,1px)}93%{transform:translate(4px,-1px)}96%{transform:translate(-2px,0)}}
.bub{position:fixed;top:calc(env(safe-area-inset-top,0px) + 120px);left:50%;transform:translateX(-50%);width:min(88vw,360px);background:#0f6b3acc;border:2px solid #3dffb0;border-radius:22px;padding:14px 16px;font-size:14px;line-height:1.5;box-shadow:0 0 24px #3dffb066;animation:pop .4s}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
#env{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);text-align:center;font-size:11px;color:#9fb3d9;pointer-events:none;text-shadow:0 1px 4px #000;padding:0 150px}
#cmd{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);z-index:5;display:flex;flex-direction:column-reverse;gap:8px;width:max-content;max-width:150px;align-items:stretch}
#cmd button{font-size:12px;padding:8px 10px;text-align:center}
#cmdt{background:#0d1630cc;border:1px solid #3a67c4}
#cmd.min button:not(#cmdt){display:none}
#cmd:not(:has(button:not(#cmdt))) #cmdt{display:none}
#scr{position:fixed;inset:0;z-index:20;display:none;font-family:Orbitron,"Segoe UI",system-ui,sans-serif;color:#fff;text-align:center;overflow:hidden;background:#050b22}
#scr.on{display:block}
#scr button{text-align:center}
.st{position:absolute;border-radius:50%;background:#2fb4d0;box-shadow:0 0 6px #2fb4d0;pointer-events:none}
.sp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vmin;padding:4vmin}
.sp h1{font-size:clamp(26px,6vw,64px);letter-spacing:.04em;margin:0;font-weight:700}
.sub{font-size:clamp(10px,2vw,20px);letter-spacing:.06em}
.pill{font:inherit;font-weight:700;font-size:clamp(14px,2.4vw,24px);color:#fff;background:#19c9dc;border:2px solid #5be3f0;border-radius:40px;padding:1.4vmin 5vmin;box-shadow:0 0 22px #19c9dcbb}
.pill.sv{background:linear-gradient(90deg,#eef1f6,#9aa6b8);color:#0b1330;border-color:#cfeaf2;box-shadow:0 0 22px #19c9dc}
.pl{display:flex;gap:min(9vw,90px);margin-top:1vmin;align-items:flex-start}
.orb{display:block;width:clamp(46px,9vmin,76px);aspect-ratio:1;border-radius:50%}
.o-moon{background:radial-gradient(circle,#4d4070,#241a40 72%);box-shadow:0 0 22px #3a2a6a}
.o-mars{background:radial-gradient(circle,#ffdcb4,#c9602e 72%);box-shadow:0 0 26px #e0703a}
.o-earth{background:radial-gradient(circle,#62b9ea,#12304f 72%);box-shadow:0 0 22px #2a7ab0}
.pc{background:none;border:0;color:#fff;font:inherit;padding:8px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:1.2vmin}
.pc.sel{outline:2px solid #19e6e6;box-shadow:0 0 20px #19e6e677}
.tg{border:2px solid #19c9dc;border-radius:30px;padding:.4vmin 2.2vmin;font-size:clamp(13px,2.4vw,22px);font-weight:700}
.pc small{font-size:clamp(8px,1.4vw,12px);letter-spacing:.05em;line-height:1.5;margin:0}
.bg{position:absolute;inset:0;background-size:cover;background-position:center bottom}
.gl{font:inherit;color:#fff;border:2px solid #29c5dd;border-radius:14px;background:#0a1c3a99;box-shadow:0 0 14px #29c5dd88,inset 0 0 12px #29c5dd33}
.ms{position:absolute;top:2vmin;left:2vmin;width:clamp(150px,25vw,290px);padding:1.6vmin 1.4vmin;font-family:"IBM Plex Sans",system-ui,sans-serif}
.ms b{display:block;font-size:clamp(13px,2.6vw,26px);font-weight:600}.ms span{display:block;font-size:clamp(10px,1.5vw,14px);margin-top:.8vmin}
.ms em{display:block;font-style:normal;font-size:clamp(9px,1.3vw,12px);color:#7ef0ff;margin-top:.8vmin}
.dy{position:absolute;top:1.6vmin;right:2.4vmin;font:clamp(16px,3vw,28px) "Alfa Slab One",Georgia,serif}
.rs{position:absolute;right:2vmin;top:max(9vmin,46px);display:flex;flex-direction:column;gap:1.8vmin}
.rs .gl{width:clamp(96px,16vw,195px);padding:1.6vmin 1vmin;font:clamp(11px,2.4vw,22px) "IBM Plex Sans",system-ui,sans-serif;line-height:1.35;opacity:.95}.rs small{display:block;font-size:10px;color:#7ef0ff}
.ab{position:absolute;left:0;right:0;bottom:4vmin;display:flex;justify-content:center;gap:min(5vw,60px);flex-wrap:wrap;padding:0 2vmin}
.ab .gl,.sb .gl{font:clamp(14px,2.6vw,26px) "Alfa Slab One",Georgia,serif;padding:2vmin 3.4vmin;min-width:clamp(100px,18vw,190px)}
.sb{position:absolute;left:0;right:0;bottom:clamp(70px,17vmin,130px);display:flex;justify-content:center;gap:2vmin;padding:0 2vmin}
.sb .gl{font-size:clamp(11px,2vw,20px);min-width:0;padding:1.6vmin 2.4vmin;background:#0b5a6ecc}.sb small{display:block;font:11px "IBM Plex Sans",sans-serif;color:#bff6ff}.sb .gl:disabled{opacity:.4}
.et{position:absolute;left:0;right:0;top:15%;font-family:"Alfa Slab One",Georgia,serif}.et h1{font-weight:400;font-size:clamp(24px,5.4vw,50px)}.et p{font-size:clamp(14px,2.6vw,24px);margin-top:2vmin}
@media(max-width:640px){.pl{gap:2vw}.pc{padding:3px}.pc small{font-size:8px}.tg{padding:.4vmin 1.4vmin}}
.pa{position:absolute;left:0;right:0;margin:0 auto;width:max-content;top:70%;font:clamp(18px,3.6vw,36px) Orbitron,sans-serif;padding:1.6vmin 5vmin;color:#e4e8ef;white-space:nowrap}
h1,h2,button,.logo,.g b,.tag{font-family:Orbitron,system-ui,sans-serif}
.g,#cmdt{border-color:#29c5dd;box-shadow:0 0 12px #29c5dd66,inset 0 0 10px #29c5dd22}
#ui{border-top:2px solid #29c5dd;box-shadow:0 -4px 22px #29c5dd44}
#ui button{border:1.5px solid #29c5dd;background:#0a1c3acc;box-shadow:0 0 10px #29c5dd55;border-radius:14px}
#ui .go{background:#0b7a8a;border-color:#5be3f0}#ui .panel button.on{background:var(--ok);color:#04210f}
.bub{border-color:#29c5dd;background:#0a1c3add;box-shadow:0 0 20px #29c5dd77}
.qz{text-align:left;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.qz h2,.qz button{font-family:inherit}.qz button{text-align:left}.qz .go{text-align:center}
#ui:has(.qz){max-height:44vh;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
.qz{font-size:12px}.qz h2{font-size:15px;margin:0 0 4px}.qz p{margin:0 0 6px;line-height:1.45}.qz .row{gap:6px;margin-top:6px}.qz button{padding:8px 10px;font-size:12px;border-radius:10px}
@media(max-height:480px){#ui:has(.qz){max-height:62vh}.qz{font-size:11px}}
#mtimg{position:fixed;inset:0;background:#050b1a center/contain no-repeat;pointer-events:none}
body.mt .bub{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
/* quiz problems: small red alert card on the right, no right/wrong marks */
#ui:has(.qz){left:auto;right:10px;bottom:auto;top:calc(env(safe-area-inset-top,0px) + 44px);width:min(46vw,300px);max-height:calc(100vh - 70px);padding:10px 12px;border:1.5px solid var(--red);border-radius:14px;background:#2a0a10ea;box-shadow:0 0 18px #fc3d2188,inset 0 0 12px #fc3d2122}
#ui:has(.qz) button{border:1.5px solid #fc3d21aa;background:#3a1018cc;box-shadow:0 0 8px #fc3d2144}
#ui:has(.qz) .go{background:#b8301a;border-color:#ff7a63}
.qz h2{color:#ff6a5a}
body:has(.qz) #hud,body:has(.qz) #cmd{display:none}
.ins h2{font-size:15px}.ins p{margin:0 0 4px;font-size:12px}.ins .panel{grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}#ui .ins .panel button{padding:9px 4px;font-size:11px}.ins .row{margin-top:6px}body:has(.ins) #cmd{display:none}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Alfa+Slab+One&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet"></head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div class="logo">PLANET OPS</div>
  <div id="hud" hidden>
    <div class="g"><b>Oxygen <span id="o2t"></span></b><div class="bar"><i id="o2b"></i></div></div>
    <div class="g"><b>Fuel <span id="ft"></span></b><div class="bar"><i id="fb"></i></div></div>
    <div class="g"><b>Comms</b><span id="ct">Online</span></div>
    <div class="g"><b>Samples</b><span id="st">0 of 5</span></div>
  </div>
</div>
<div id="hint"></div>
<div id="env"></div>
<div id="joy" hidden><i></i></div>
<div id="cmd"><button id="cmdt" onclick="this.parentNode.classList.toggle('min')">⚙ Controls</button><button id="spd" onclick="TS=TS===4?2:TS===2?1:4;this.textContent='⏩ ×'+TS">⏩ ×4</button></div>
<div id="ui"></div><div id="scr"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

red:{n:"Red Workshop Suit",d:"Light, fast drilling",odds:0,drill:420,c:0xd0312d,base:0x1a1a1d,acc:0xd0312d,dark:0x0f0f11,kind:"light",img:"s8"},
orange:{n:"Orange Workshop Suit",d:"Light, medium drilling",odds:5,drill:500,c:0xff8a1f,base:0x1a1a1d,acc:0xff8a1f,dark:0x0f0f11,kind:"light",img:"s9"}};
const SHIPS={shuttle:{n:"Space Shuttle",e:"🚀",d:"Saves fuel on every trip",fuel:15,odds:0,c:0xfc3d21,img:"sh11",black:1},cargo:{n:"Orbital Cargo Module",e:"📦",d:"Bigger storage: bonus points per sample",fuel:0,odds:0,c:0x2a63c9,img:"sh2"},rover:{n:"Explorer Craft",e:"🛰️",d:"Strong shielding: safer in risky choices",fuel:0,odds:10,c:0x3ddc97,img:"sh10"}};

/* ---------- engine ---------- */
const R=new T.WebGLRenderer({canvas:$("c"),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,1.25));R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=.9;

const mk=(g,c,e)=>{const o=new T.Mesh(g,new T.MeshStandardMaterial({color:c,emissive:e||0,roughness:.8,metalness:.05}));o.castShadow=o.receiveShadow=true;return o};
function newScene(bg,fog){sc=new T.Scene();sc.background=new T.Color(bg);if(fog)sc.fog=new T.FogExp2(bg,fog);const am=new T.AmbientLight(0xffffff,.6);sc.add(am);const d=new T.DirectionalLight(0xffffff,.9);d.position.set(5,12,6);d.castShadow=true;d.shadow.mapSize.set(1024,1024);const sw=d.shadow.camera;sw.left=sw.bottom=-30;sw.right=sw.top=30;sw.near=1;sw.far=140;d.shadow.bias=-.0006;sc.add(d);sc.add(d.target);sc.userData.sun=d;sc.userData.amb=am;sc.environment=envTex();HF=null;GR=9.8;FP=[];DASH=null;$('env').textContent='';walk=null;marks=[];acts=[];tick=()=>{};$("joy").hidden=true;$("hint").textContent=""}
function stars(n){const a=[],c=[],col=new T.Color();for(let i=0;i<n;i++){let x,y,z;if(i%3===0){const t=Math.random()*6.28,s=(Math.random()-.5)*Math.random()*.5;x=Math.cos(t)*450;z=Math.sin(t)*450;y=s*450+Math.cos(t*2)*60}else{x=(Math.random()-.5)*900;y=(Math.random()-.5)*700;z=(Math.random()-.5)*1000}a.push(x,y,z);col.setHSL(Math.random()<.3?.6:Math.random()<.5?.1:0,.4,.55+Math.random()*.45);c.push(col.r,col.g,col.b)}
  const g=new T.BufferGeometry();g.setAttribute("position",new T.Float32BufferAttribute(a,3));g.setAttribute("color",new T.Float32BufferAttribute(c,3));sc.add(new T.Points(g,new T.PointsMaterial({size:1.7,vertexColors:true,fog:false,sizeAttenuation:false})))}
const FAB={};
function fabric(base){
  if(FAB[base])return FAB[base];const k=document.createElement("canvas");k.width=k.height=256;const x=k.getContext("2d");
  x.fillStyle="#"+base.toString(16).padStart(6,"0");x.fillRect(0,0,256,256);

  for(let i=0;i<260;i++){x.strokeStyle=`rgba(0,0,0,${Math.random()*.1})`;x.lineWidth=1+Math.random()*2;x.beginPath();const a=Math.random()*256,b=Math.random()*256;x.moveTo(a,b);x.lineTo(a+(Math.random()-.5)*50,b+(Math.random()-.5)*14);x.stroke()}
  for(let i=0;i<500;i++){x.fillStyle=`rgba(${Math.random()<.5?"90,80,70":"255,255,255"},${Math.random()*.08})`;x.fillRect(Math.random()*256,Math.random()*256,2+Math.random()*6,2+Math.random()*6)}
  const t=new T.CanvasTexture(k);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(2,2);return FAB[base]=t}
const fm=c=>new T.MeshStandardMaterial({map:fabric(c),bumpMap:fabric(c),bumpScale:.35,roughness:.92,metalness:0});
function shipM(c){
  const kind=c===0x2a63c9?"cargo":c===0x3ddc97?"rover":"shuttle",g=new T.Group(),W=0xe8ecf5,D=0x20242e,GL=0x2a4a7a;
  const P=(geo,col,x,y,z,e,rx,ry,rz)=>{const o=mk(geo,col,e||0);o.position.set(x,y,z);o.rotation.set(rx||0,ry||0,rz||0);g.add(o);return o};
  const flame=(x,y,z,r)=>{P(new T.CylinderGeometry(r,r*1.2,.6,14),D,x,y,z,0,Math.PI/2);P(new T.ConeGeometry(r*.8,1.1,12),0xff7a1a,x,y,z+.9,0xff5a00,Math.PI/2)};
  if(kind==="shuttle"){
    P(new T.CylinderGeometry(.85,.95,5,20),W,0,0,0,0,Math.PI/2);
    P(new T.ConeGeometry(.85,2,20),c,0,0,-3.5,0,-Math.PI/2);
    P(new T.CylinderGeometry(.9,.9,.3,20),c,0,0,-1.2,0,Math.PI/2);
    P(new T.BoxGeometry(.9,.25,.6),GL,0,.62,-2.3,0x1a3a6a);

  const items=[];for(let i=0;i<c.n;i++){const a=i*(6.28/c.n)+.4,d=11+i*2.6,x=Math.cos(a)*d,z=Math.sin(a)*d-3,m=c.relics?relicM(c.relics[i]):mk(new T.OctahedronGeometry(.6),c.it,c.it);m.position.set(x,(c.relics?0:1.2)+HF(x,z),z);sc.add(m);const rg=ring(x,z,c.it,1.1);rg.visible=m.visible=false;items.push({x,z,m,rg,done:false,id:c.relics&&c.relics[i]})}

  let got=0,over=false,hz=0,lx=0,lz=4;const ins=inspectInit();
  startWalk(0,4,48,[],d=>{
    if(over)return;const P=walk.p.position,mv=Math.hypot(P.x-lx,P.z-lz)>.003;lx=P.x;lz=P.z;let dx=1,w="";if(!ins.done){inspectTick(ins,P);$("hint").textContent=`Inspect the spacecraft: approach the blue rings (${ins.n} of 5)`;if(ins.done)items.forEach(it=>{it.m.visible=it.rg.visible=true});return}if(c.mode==="heat"){dx=1.5;w="🔥 Heat 464°C drains your suit"}

    for(const m of rad){m.position.x+=m.userData.v[0]*d;m.position.z+=m.userData.v[1]*d;m.position.y=HF(m.position.x,m.position.z)+.15;if(Math.abs(m.position.x)>46)m.userData.v[0]*=-1;if(Math.abs(m.position.z)>46)m.userData.v[1]*=-1;if(Math.hypot(P.x-m.position.x,P.z-m.position.z)<3){dx=4;w="☢ Deadly radiation! Leave the red circle"}}
    S.o2=Math.max(0,S.o2-c.drain*dx*(S.damaged?1.3:1)*d);hud();
    let nd=1e9;for(const it of items){if(it.done)continue;const q=Math.hypot(P.x-it.x,P.z-it.z);nd=Math.min(nd,q);if(q<2.3){it.done=true;got++;beep(900,.2,"triangle");if(it.id){walk.stop=true;$("joy").hidden=true;relicCard(it.id,()=>{walk.stop=false;$("joy").hidden=false})}else it.m.visible=false}}
    const toShip=Math.hypot(P.x,P.z+3);

function belt(){
  S.o2=100;hud();clearCam();newScene(0x04050c);ui("");stars(2000);$("joy").hidden=false;
  const sh=shipM(SHIPS[S.ship].c);sh.position.set(0,0,0);sc.add(sh);cam.position.set(0,4,10);cam.lookAt(0,0,-10);
  let hull=100,prog=0,eng=true,over=false,cd=0,sp=0,paused=false,spawned=0;const rocks=[];
  if(S.backup)dom("📡 Backup device<br><small>Repair +30%</small>","right:auto;left:16px;bottom:200px",function(){hull=Math.min(100,hull+30);S.backup=false;this.remove()});
  const pw=dom("⚡ Engine","",()=>{eng=!eng;pw.innerHTML=eng?"⚡ Engine":"🛡 Shield"});
  tick=d=>{
    if(over||paused)return;
    const vx=(K.arrowright||K.d?1:0)-(K.arrowleft||K.a?1:0)+jx;sh.position.x=Math.max(-9,Math.min(9,sh.position.x+vx*12*d));sh.rotation.z=-vx*.4;
    prog+=d*(eng?(S.fuel<30?9:11):6);sp+=d;cd-=d;if(spawned<2&&prog>(spawned+1)*30){const id=["dawn","near"][spawned++],m=relicM(id);m.position.set((Math.random()-.5)*14,0,-90);m.scale.setScalar(1.6);m.userData.rel=id;sc.add(m);rocks.push(m)}
    if(sp>.35){sp=0;const m=mk(new T.IcosahedronGeometry(.8+Math.random()*1.4,0),0x7a6a5a);m.position.set((Math.random()-.5)*20,(Math.random()-.5)*2,-90);m.userData.r=m.geometry.parameters.radius;sc.add(m);rocks.push(m)}
    for(let i=rocks.length-1;i>=0;i--){const m=rocks[i];if(m.userData.rel){m.position.z+=30*d;if(Math.abs(m.position.z)<2.5&&Math.abs(m.position.x-sh.position.x)<2.5){const id=m.userData.rel;sc.remove(m);rocks.splice(i,1);paused=true;$("joy").hidden=true;beep(900,.3,"triangle");relicCard(id,()=>{paused=false;$("joy").hidden=false})}else if(m.position.z>14){sc.remove(m);rocks.splice(i,1)}continue}m.position.z+=(eng?42:30)*d;m.rotation.x+=d;m.rotation.y+=d*.7;
      if(cd<=0&&Math.abs(m.position.z)<m.userData.r+1.5&&Math.abs(m.position.x-sh.position.x)<m.userData.r+1.1){hull-=eng?20:10;cd=.8;beep(120,.3,"sawtooth");cam.position.x=(Math.random()-.5)}
      if(m.position.z>14){sc.remove(m);rocks.splice(i,1)}}
    cam.position.x*=.9;
    $("hint").innerHTML=`🛰 Hull integrity ${Math.max(0,Math.round(hull))}% · Progress ${Math.min(100,Math.round(prog))}%`;
    if(hull<=0){over=true;$("joy").hidden=true;after(3,false)}
    else if(prog>=100){over=true;$("joy").hidden=true;after(3,true,"You exit the belt with metal scraping your hull. Jupiter looms ahead.")}
  };
}

const TL=new T.TextureLoader();
function cover(t,ia){const a=innerWidth/innerHeight;if(a<ia){t.repeat.set(a/ia,1);t.offset.set((1-a/ia)/2,0)}else{t.repeat.set(1,ia/a);t.offset.set(0,(1-ia/a)/2)}}
function bgImg(k,ia){const t=TL.load(IMG[k]);cover(t,ia);sc.background=t}
function cutTex(k,W,H,thr,black){const cv=document.createElement("canvas");cv.width=W;cv.height=H;const t=new T.CanvasTexture(cv),im=new Image();
  im.onload=()=>{const x=cv.getContext("2d"),s=Math.min(W/im.width,H/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);const d=x.getImageData(0,0,W,H),p=d.data;
    for(let i=0;i<p.length;i+=4){if(!p[i+3])continue;const m=black?Math.max(p[i],p[i+1],p[i+2]):Math.min(p[i],p[i+1],p[i+2]);const a=black?(m-thr)/25:(thr-m)/20+1;p[i+3]*=Math.min(1,Math.max(0,a))}
    x.putImageData(d,0,0);t.needsUpdate=true};im.src=IMG[k];return t}
function groundTex(){const t=TL.load(IMG.moonGround);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(26,26);t.anisotropy=4;return t}
function cards(items,tx,ratio,pick){
  const n=items.length,cols=cam.aspect<1.1?2:n,rows=Math.ceil(n/cols),hw=10*Math.tan(.5236)*cam.aspect,sp=Math.min(4,hw*2*.94/cols),h=Math.min(sp/ratio,(10-rows*1.4)/rows),w=h*ratio;
  items.forEach(([k,v],i)=>{const c=i%cols,r=Math.floor(i/cols),x=(c-(cols-1)/2)*sp,y=((rows-1)/2-r)*(h+1.5)+.4;
    const s=new T.Sprite(new T.SpriteMaterial({map:tx(v),transparent:true,toneMapped:false}));s.scale.set(w,h,1);s.position.set(x,y,0);sc.add(s);

function showPlanet(){show(stars2()+`<div class="sp"><h1>CHOOSE YOUR PLANET</h1><div class="pl">${Object.entries(PL).map(([k,p])=>`<button class="pc" data-k="${k}"><i class="orb o-${k}"></i><span class="tg">${p.n}</span><small>${p.d}<br>DIFFICULTY: ${p.l}</small></button>`).join("")}</div><button class="pill sv" id="pcont" disabled style="opacity:.5">CONTINUE</button></div>`);

function baseView(sub){const low=v=>v<=30?'style="color:#ff6a5a;text-shadow:0 0 10px #f33"':"";
  show(bgd(1.3)+`<div class="gl ms"><b>CURRENT MISSION</b><span>Build and maintain a stable base for 5 days</span><em>${B.note}Actions left today: ${B.ap}</em></div><div class="dy">DAY ${B.day} / 5</div>

function nextDay(){const p=PL[PK];let ev="";
  for(const k in B.r)B.r[k]=Math.max(0,B.r[k]-Math.max(3,p.dr+Math.round(Math.random()*6-3)-B.up[k]*4));

  if(Object.values(B.r).some(v=>v<=0))return endScr(false);

function failMission(msg){ui("");$("hint").textContent="";$("joy").hidden=true;$("hud").hidden=true;rmEx();tick=()=>{};if(walk)walk.stop=true;endScr(false,msg)}
function quiz(n,next){
  if(QD[n])return next();QD[n]=1;QR[n]=[];const m=QZ[n];let i=0;
  const ask=()=>{const q=m.q[i],o=q.o.map((x,j)=>({l:(j+1)+". "+x,f:()=>ans(j)}));
    ui(`<div class="qz"><h2>${m.t}</h2>${i?"":`<p>${m.s}</p>`}<p><b>${q.q}</b></p>${choose(o)}</div>`);wire(o)};
  const ans=j=>{const q=m.q[i],ok=j===q.a,last=i>=m.q.length-1;QR[n].push(ok);
    if(ok)S.bonus++;else{QW++;S.fuel=Math.max(10,S.fuel-8)}
    if(QW>3)return failMission("Too many wrong decisions.");
    if(!last){i++;ask()}else if(n===4)recap(next);else{ui("");next()}};
  $("hint").textContent="";ask()}
function recap(next){const rows=QZ.slice(1).map((m,k)=>`<p>${k+1}️⃣ ${m.sum}</p>`).join("");
  ui(`<div class="qz"><h2>📋 Mission summary</h2>${rows}<div class="row"><button class="go" id="qr">Continue ▸</button></div></div>`);$("qr").onclick=()=>{ui("");next()}}
{const v=venus,s2=stage2,s3=stage3,s4=stage4,bt=boot,mt=meeting,bs=base;
 venus=()=>quiz(1,v);stage2=()=>quiz(2,s2);stage3=()=>quiz(3,s3);stage4=()=>quiz(4,s4);
 boot=()=>{QW=0;for(const k in QD){delete QD[k];delete QR[k]}bt()};
 meeting=()=>{document.body.classList.add("mt");const d=document.createElement("div");d.id="mtimg";d.style.backgroundImage=`url(${IMG.meet})`;document.body.insertBefore(d,document.getElementById("top"));mt()};base=p=>{document.body.classList.remove("mt");const d=document.getElementById("mtimg");if(d)d.remove();bs(p)}}
</script>
</body>
</html>
